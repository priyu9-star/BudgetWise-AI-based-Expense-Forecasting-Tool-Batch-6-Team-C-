<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpendGenie - AI Expense Forecasting</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
      --button-radius: 8px; /* Default button shape */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #ff4f8c, #ffffff);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }

    /* NAVBAR */
    .navbar {
      width: 100%;
      padding: 25px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-circle {
      width: 40px;
      height: 40px;
      background: #ddd;
      border-radius: 50%;
    }

    .menu {
      display: flex;
      gap: 35px;
      font-size: 18px;
    }

    .menu a {
      text-decoration: none;
      color: #fff;
      font-weight: 500;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-outline {
      padding: 8px 18px;
      border: 1.5px solid #fff;
      border-radius: var(--button-radius);
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: rgba(255,255,255,0.2);
    }

    .btn-fill {
      padding: 8px 18px;
      border-radius: var(--button-radius);
      background: #5a2aff;
      color: #fff;
      cursor: pointer;
      border: none;
      transition: 0.2s;
border-radius: var(--button-radius);

    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      margin-top: 30px;
      max-width: 800px;
    }

    .hero h1 {
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .hero p {
      margin-top: 15px;
      font-size: 18px;
      color: #f5f5f5;
      line-height: 1.5;
    }

    .get-started {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 18px;
      border-radius: var(--button-radius);
      background: #5a2aff;
      border: none;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }

    /* LAPTOP IMAGE */
    .laptop-container {
  margin-top: 40px;
  width: 900px;
}

.laptop-container img {
  width: 100%;
  border-radius: 10px;
  box-shadow: 0px 10px 25px rgba(0,0,0,0.25);
}

    /* FOOTER */
    footer {
      width: 100%;
      background: #222;
      color: #fff;
      padding: 30px 0;
      margin-top: 60px;
      text-align: center;
      font-size: 16px;
    }

    footer a {
      color: #ccc;
      margin: 0 12px;
      text-decoration: none;
      font-size: 15px;
    }

    footer a:hover {
      color: #fff;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <div class="logo-circle"></div>
      <span style="font-size: 20px; color:#fff; font-weight:600;">SpendGenie </span>
    </div>

    <div class="menu">
      <a href="#">About</a>
      <a href="#">Contact Us</a>
    </div>

    <div class="nav-buttons">
      <button class="btn-outline">Sign In</button>
      <button class="btn-fill">Register</button>
    </div>
  </div>

  <!-- HERO CONTENT -->
  <div class="hero">
    <h1>Your Budget, Re-imagined With<br>Intelligence with SpendGenie</h1>

    <p>
      An AI that listens to the rhythm of your spending and predicts tomorrow’s trends.<br>
      Transform financial chaos into crystal-clear insights.
    </p>

    <button class="get-started">Get Started</button>
  </div>

  <!-- MAIN DASHBOARD MOCKUP -->
  <div class="laptop-container">
    <img src="dasboard.png" alt="Dashboard Mockup">
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 SpendGenie | All Rights Reserved</p>
    <div style="margin-top:12px;">
      <a href="#">About</a>
      <a href="#">Contact Us</a>
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

</body>
</html>
